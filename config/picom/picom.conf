# Optimized for Intel HD Graphics (3rd Gen i3)

#################################
#             Corners           #
#################################
# This gives you the look from your photo
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#             Shadows           #
#################################
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.4;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "_GTK_FRAME_EXTENTS@"
];

#################################
#           Fading              #
#################################
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;

#################################
#   Transparency / Opacity      #
#################################
inactive-opacity = 0.85;
active-opacity = 1.0;
frame-opacity = 1.0;

# Make Alacritty transparent, keep Firefox solid
opacity-rule = [
  "90:class_g = 'Alacritty'",
  "100:class_g = 'firefox'",
  "100:class_g = 'Thunar'"
];

#################################
#           Blur                #
#################################
# WARNING: Blur is heavy on 3rd Gen Intel. 
# If your PC lags, change "dual_kawase" to "none"
blur-method = "none"; 
blur-strength = 0;

#################################
#       General Settings        #
#################################
# Xrender is MUCH faster than GLX on old Intel chips
backend = "xrender";
vsync = true;
mark-wmwin-focused = true;
mark-ovlp-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;